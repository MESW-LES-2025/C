name: Quick Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore C.sln
    
    - name: Build
      run: dotnet build C.sln --no-restore --configuration Release
    
    - name: Run tests
      run: dotnet test C.sln --no-build --configuration Release --verbosity normal
