<section class="page process-details">

  <div class="page-header">
    <app-page-title [title]="title"></app-page-title>
  </div>

  <div class="process-grid">

    <main class="process-main">
        <section class="process-info">
            <h3 class="process-title">Process Information</h3>
        </section>
    </main>


    <aside class="process-side">
      <section class="card-client-card">

  <h3 class="client-title">Client</h3>

  <div class="client-info">
    <div class="client-main">
        <div class="client-left">
            <p class="client-name">{{ process.clientName }}</p>
            <p class="client-location">{{ process.clientLocation }}</p>
        </div>

        <div class="client-avatar">
            <span>{{ getInitials(process.clientName) }}</span>
        </div>
        </div>
    </div>

    </section>


      <section class="card-chat-card">
        <h3 class="chat-title">Chat</h3>
      </section>
    </aside>

  </div>

</section>
