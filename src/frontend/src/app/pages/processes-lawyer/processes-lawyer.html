<section class="page">
  <app-page-title title="Processes"></app-page-title>

  <div class="cases-overview-card">
    <div class="overview-title">Overview</div>

    <div class="overview-body">
      <div class="overview-item">
        <div class="overview-number">{{ totalProcesses }}</div>
        <div class="overview-label">Number of Processes</div>
      </div>

    </div>
  </div>

  <div class="cases-toolbar">
    <div class="search-box">
      <i class="fa fa-search search-icon" aria-hidden="true"></i>
      <input class="search" type="search" placeholder="Search processes…" />
    </div>

    <app-button
      label="Start Process"
      icon="fa-plus"
      type="button"
      variant="primary"
      (click)="startProcess()"
    ></app-button>

  </div>

  <section
    class="case-details"
    *ngFor="let c of processes"
    (click)="openProcess(c.processId)"
  >
    <div class="case-header">
      <div class="case-info">
        <p class="case-location">{{ c.courtInfo }}</p>
        <h2 class="case-title">{{ c.name }}</h2>
        <p class="case-description">
          {{ c.description }}
        </p>
      </div>

      <div class="divider"></div>

      <div class="client-info">
        <div class="client-main">
          <div class="client-left">
            <p class="client-name">{{ c.clientId }}</p>
            <!-- <p class="client-location">{{ c.clientLocation }}</p> -->
          </div>

          <div class="client-avatar">
            <!--<span>{{ getInitials(c.clientName) }}</span> -->
          </div>
        </div>

        <button class="contact-btn">Contact</button>
      </div>
    </div>
  </section>

    <app-pagination
      [currentPage]="currentPage"
      [totalPages]="totalPages"
      (pageChange)="goToPage($event)"
    ></app-pagination>



</section>
