<section class="page">
  <app-page-title title="Processes"></app-page-title>

  <div class="cases-overview-card">
    <div class="overview-title">Overview</div>

    <div class="overview-body">
      <div class="overview-item">
        <div class="overview-number">5</div>
        <div class="overview-label">Open Processes</div>
      </div>

      <div class="divider-overview"></div>

      <div class="overview-item">
        <div class="overview-number">24</div>
        <div class="overview-label">Closed Processes</div>
      </div>
    </div>
  </div>

  <div class="cases-toolbar">
    <div class="search-box">
      <i class="fa fa-search search-icon" aria-hidden="true"></i>
      <input class="search" type="search" placeholder="Search processes…" />
    </div>

    <app-button
      label="Start Process"
      icon="fa-plus"
      type="button"
      variant="primary"
    ></app-button>

  </div>

  <section
    class="case-details"
    *ngFor="let c of processes"
  >
    <div class="case-header">
      <div class="case-info">
        <p class="case-location">{{ c.caseLocation }}</p>
        <h2 class="case-title">{{ c.title }}</h2>
        <p class="case-description">
          {{ c.description }}
        </p>
      </div>

      <div class="divider"></div>

      <div class="client-info">
        <div class="client-main">
          <div class="client-left">
            <p class="client-name">{{ c.clientName }}</p>
            <p class="client-location">{{ c.clientLocation }}</p>
          </div>

          <div class="client-avatar">
            <span>{{ getInitials(c.clientName) }}</span>
          </div>
        </div>

        <button class="contact-btn">Contact</button>
      </div>
    </div>
  </section>



  <div class="pagination">
    <button disabled>First</button>
    <button disabled>Previous</button>

    <span>Page {{ currentPage }} of {{ totalPages }}</span>

    <span>
      Go to:
      <input
        type="number"
        min="1"
        [max]="totalPages"
        [(ngModel)]="goToPageNumber"
        class="goto-input"
        disabled
      />
      <button disabled>Go</button>
    </span>

    <button disabled>Next</button>
    <button disabled>Last</button>
  </div>


</section>
