services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: build-backend-dev
    ports:
      - "8080:8080"
    # depends_on:
    #   - qdrant
    volumes:
      - ./src:/src/src
      - ./C.sln:/src/C.sln
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      #- Qdrant__Url=http://qdrant:6333
      - Logging__LogLevel__Default=Debug

  frontend:
    image: node:20
    working_dir: /app
    ports:
      - "4200:4200"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm start -- --host 0.0.0.0"

  # qdrant:
  #   image: qdrant/qdrant:latest
  #   restart: always
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrant_data:/qdrant/storage

volumes:
  qdrant_data: